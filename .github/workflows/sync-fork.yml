name: Sync fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'metathrone/RSSHub'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/DIYgod/RSSHub.git || git remote set-url upstream https://github.com/DIYgod/RSSHub.git
          git fetch upstream master
          git merge -X ours upstream/master -m "chore(sync): merge upstream changes"
          git push origin master
